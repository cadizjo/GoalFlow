name: E2E Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goalflow_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      # Database
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/goalflow_test?schema=public

      # Auth
      JWT_SECRET: test-secret-test-secret-test-secret-long-enough
      JWT_EXPIRES_IN: 15m
      BCRYPT_ROUNDS: 10

      # Throttler — high limits so tests never hit 429
      THROTTLE_GLOBAL_LIMIT: 10000
      THROTTLE_AUTH_LIMIT: 10000

      # AI service — not called during e2e tests but required by env schema
      ANTHROPIC_API_KEY: test-key-not-real
      AI_SERVICE_URL: http://localhost:8000

      NODE_ENV: test

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: backend
        run: npm ci

      - name: 📦 Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: 🧱 Run Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: 🧪 Run unit tests
        working-directory: backend
        run: npm test

      - name: 🧪 Run E2E tests
        working-directory: backend
        run: npm run test:e2e